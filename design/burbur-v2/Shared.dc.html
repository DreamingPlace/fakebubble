<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Burbur 分享的语音小卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(70% 35% at 10% 15%, #DCD2FF 0%, transparent 70%), radial-gradient(60% 35% at 95% 50%, #FFD8EE 0%, transparent 70%), radial-gradient(80% 40% at 30% 100%, #BBA4FF 0%, transparent 70%), #FAF8F6; color: #141414; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 47px; flex-shrink: 0; background: #2B2A2E; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px; color: #B5B0AA">status bar · system</div>

  <header style="height: 56px; flex-shrink: 0; padding: 0 20px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px">
      <dc-import name="Hand" text="burbur" size="40" color="#141414" weight="2" hint-size="108px,40px"></dc-import>
    </div>
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 13px">这是什么？</a>
  </header>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px">
    <div style="position: relative; z-index: 2; margin-bottom: -12px; transform: rotate(-3deg); background: #FFFFFF; border-radius: 4px; padding: 8px 14px; box-shadow: 0 6px 16px rgba(40, 24, 60, 0.12); font-size: 14px; font-weight: 700">
      <i aria-hidden="true" style="position: absolute; left: 50%; top: -8px; width: 54px; height: 16px; transform: translateX(-50%) rotate(-4deg); background: #BBA4FF; opacity: 0.85"></i>
      收到一张语音小卡
    </div>

    <div style="width: 286px; height: 452px; box-sizing: border-box; padding: 7px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.85); background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); box-shadow: 0 24px 60px rgba(40, 24, 60, 0.2); transform: rotate(2deg)">
      <div style="position: relative; width: 100%; height: 100%; border-radius: 23px; overflow: hidden; background: linear-gradient(165deg, #BBA4FF 0%, #DCD2FF 45%, #FFFFFF 100%); display: flex; flex-direction: column; padding: 18px 18px 16px; box-sizing: border-box">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(115deg, transparent 28%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 210, 246, 0.5) 48%, rgba(186, 236, 255, 0.5) 54%, transparent 68%); mix-blend-mode: soft-light"></div>
        <div style="position: relative; display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.06em"><span>VOICE CARD</span><span>No.0412</span></div>
        <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center">
          <div style="font-size: 76px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.95">陈吉米</div>
          <dc-import name="Hand" text="chen jimi" size="44" color="#141414" weight="1.9" hint-size="190px,44px"></dc-import>
        </div>
        <p style="position: relative; margin: 0 0 14px; font-size: 17px; font-weight: 700; line-height: 1.45">“别熬了，游戏明天还在。你的黑眼圈可不会自己消失。”</p>
        <div style="position: relative; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px 0 8px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40, 24, 60, 0.1)">
          <button type="button" aria-label="播放陈吉米的语音" style="width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 50%; background: #7C4DEB; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </button>
          <span style="display: flex; align-items: center; gap: 2px; height: 22px; flex-grow: 1; overflow: hidden" aria-hidden="true">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="26"><i style="width: 3px; flex-shrink: 0; border-radius: 2px; background: rgba(20, 20, 20, 0.22); height: {{b.h}}px"></i></sc-for>
          </span>
          <span style="font-family: 'DM Mono', monospace; font-size: 11px; color: #4A4A4A">0:11</span>
        </div>
        <div style="position: relative; display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.04em; padding-top: 10px; color: #4A4A4A"><span>UTC+8 22:41</span><span>2026.10.12</span></div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 0 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative">
    <a href="Chat.dc.html" style="width: 100%; max-width: 300px; height: 54px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none">也和陈吉米聊聊 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"></path></svg></a>
    <span style="font-size: 13px; color: #3F3F3F">来聊几句嘛～</span>
  </div>

  <div style="height: 80px; flex-shrink: 0; background: #2B2A2E; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px; color: #B5B0AA">Safari address bar · system</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { bars: [8,12,18,22,14,10,20,22,16,12,20,14,8,18,22,16,10,14,22,18,12,16,8,20,12,18].map(function (h) { return { h: h }; }) };
  }
}
</script>
</body>
</html>
