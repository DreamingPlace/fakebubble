<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Burbur 后台 总览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
@keyframes dbIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes dbDraw { from { stroke-dashoffset: 1400 } to { stroke-dashoffset: 0 } }
@keyframes dbSpin { from { opacity: 0; transform: rotate(-90deg) scale(0.9) } to { opacity: 1; transform: none } }
.db-in { animation: dbIn 360ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
.db-draw { stroke-dasharray: 1400; animation: dbDraw 900ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
.db-spin { animation: dbSpin 620ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
@media (prefers-reduced-motion: reduce) { .db-in, .db-draw, .db-spin { animation-duration: 1ms !important } }
</style>
</helmet>
<div style="min-height: 1180px; background: radial-gradient(40% 26% at 18% 0%, #FFE3D3 0%, transparent 70%), radial-gradient(35% 24% at 70% 0%, #E9E2FF 0%, transparent 70%), #FAF8F6; color: #141414; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-wrap: wrap; font-variant-numeric: tabular-nums">

  <div style="flex: 1 1 248px; max-width: 260px"><dc-import name="AdminNav" current="总览" hint-size="248px,1100px"></dc-import></div>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 36px 40px">
    <div style="max-width: 1120px; display: flex; flex-direction: column; gap: 20px">

      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <h1 style="margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.04em; line-height: 1">总览</h1>
        <a href="System.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #141414; font-size: 13px; font-weight: 700"><i style="width: 8px; height: 8px; border-radius: 50%; background: #1E8E4E"></i>系统正常 <span aria-hidden="true">→</span></a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
        <div class="db-in" style="background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 700">今日回复</span>
          <span style="font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1">412</span>
          <span style="font-size: 13px; color: #3F3F3F">语音 298 · 失败 6</span>
        </div>
        <div class="db-in" style="animation-delay: 50ms; background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 700">今日花费</span>
          <span style="font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1">$7.40 <span style="font-size: 18px; font-weight: 500; color: #3F3F3F">/ $30</span></span>
          <div role="meter" aria-label="今日花费占告警线" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 999px; background: #EFEBE6; overflow: hidden"><div style="width: 25%; height: 100%; border-radius: 999px; background: #141414"></div></div>
        </div>
        <div class="db-in" style="animation-delay: 100ms; background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 700">今天聊天的人</span>
          <span style="font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1">27</span>
          <span style="font-size: 13px; color: #3F3F3F">注册 11 · 访客 16 · 新 4</span>
        </div>
        <a href="Inbox.dc.html" class="db-in" style="animation-delay: 150ms; background: #141414; color: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; text-decoration: none">
          <span style="font-size: 13px; font-weight: 700">共创待处理</span>
          <span style="font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1">9</span>
          <span style="font-size: 13px; font-weight: 700">去收件箱 →</span>
        </a>
      </div>

      <section aria-labelledby="chart-title" style="background: #FFFFFF; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <div role="group" aria-label="指标" style="display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: #F3F0EC">
            <sc-for list="{{metrics}}" as="m" hint-placeholder-count="2">
              <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 34px; padding: 0 16px; border: none; border-radius: 999px; background: {{m.bg}}; color: {{m.fg}}; font: inherit; font-size: 14px; font-weight: 900; cursor: pointer; transition: background 200ms ease, color 200ms ease">{{m.label}}</button>
            </sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <div role="group" aria-label="时间范围" style="display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: #F3F0EC">
              <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
                <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="height: 32px; padding: 0 14px; border: none; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 200ms ease">{{r.label}}</button>
              </sc-for>
            </div>
            <div role="group" aria-label="图表类型" style="display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: #F3F0EC">
              <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
                <button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" aria-label="{{v.label}}" style="width: 40px; height: 32px; border: none; border-radius: 999px; background: {{v.bg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 200ms ease">
                  <sc-if value="{{v.isLine}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 7-8"></path></svg></sc-if>
                  <sc-if value="{{v.isPie}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v8h8"></path></svg></sc-if>
                  <sc-if value="{{v.isTable}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></sc-if>
                </button>
              </sc-for>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px"><i style="width: 10px; height: 10px; border-radius: 50%; background: {{l.col}}"></i>{{l.name}} <b>{{l.v}}</b></span>
          </sc-for>
        </div>

        <sc-if value="{{lineOn}}" hint-placeholder-val="{{ true }}">
          <div class="db-in" style="position: relative; height: 230px">
            <svg viewBox="0 0 640 220" preserveAspectRatio="none" role="img" aria-label="{{metricLabel}}折线" style="position: absolute; inset: 0 0 20px 0; width: 100%; height: 210px; overflow: visible">
              <sc-for list="{{gridY}}" as="g" hint-placeholder-count="4"><line x1="0" x2="640" y1="{{g.y}}" y2="{{g.y}}" stroke="#F0ECE7" stroke-width="1" vector-effect="non-scaling-stroke"></line></sc-for>
              <sc-for list="{{lines}}" as="l" hint-placeholder-count="3"><polyline class="db-draw" points="{{l.pts}}" fill="none" stroke="{{l.col}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline></sc-for>
            </svg>
            <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 11px; color: #4A4A4A">
              <sc-for list="{{xlabels}}" as="x" hint-placeholder-count="7"><span>{{x}}</span></sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{pieOn}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; min-height: 230px">
            <div class="db-spin" role="img" aria-label="{{pieAria}}" style="width: 200px; height: 200px; border-radius: 50%; background: {{pie}}; display: flex; align-items: center; justify-content: center">
              <div style="width: 120px; height: 120px; border-radius: 50%; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 28px; font-weight: 900">{{total}}</span><span style="font-size: 12px">{{unit}}</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px">
              <sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
                <span style="display: flex; align-items: center; gap: 10px; font-size: 15px"><i style="width: 12px; height: 12px; border-radius: 50%; background: {{l.col}}"></i><span style="width: 64px">{{l.name}}</span><b style="font-size: 20px">{{l.share}}</b></span>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{tableOn}}" hint-placeholder-val="{{ false }}">
          <div class="db-in" style="max-height: 280px; overflow: auto">
            <table style="width: 100%; border-collapse: collapse; font-size: 13px">
              <thead><tr style="text-align: right; font-family: 'DM Mono', monospace; font-size: 11px; color: #4A4A4A"><th scope="col" style="text-align: left; padding: 6px 8px; font-weight: 500">{{timeHead}}</th><th scope="col" style="padding: 6px 8px; font-weight: 500">瓜瓜</th><th scope="col" style="padding: 6px 8px; font-weight: 500">JOJO</th><th scope="col" style="padding: 6px 8px; font-weight: 500">陈吉米</th><th scope="col" style="padding: 6px 8px; font-weight: 500">{{sumHead}}</th></tr></thead>
              <tbody>
                <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
                  <tr style="text-align: right; border-top: 1px solid #F0ECE7"><th scope="row" style="text-align: left; padding: 7px 8px; font-weight: 500; font-family: 'DM Mono', monospace">{{r.day}}</th><td style="padding: 7px 8px">{{r.g}}</td><td style="padding: 7px 8px">{{r.j}}</td><td style="padding: 7px 8px">{{r.m}}</td><td style="padding: 7px 8px; font-weight: 700">{{r.t}}</td></tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </sc-if>
      </section>

      <div style="display: flex; flex-wrap: wrap; gap: 14px">
        <section aria-labelledby="todo-title" style="flex: 1 1 320px; background: #FFFFFF; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px">
          <h2 id="todo-title" style="margin: 0 0 8px; font-size: 17px; font-weight: 900">待处理</h2>
          <sc-for list="{{todo}}" as="t" hint-placeholder-count="4">
            <a href="{{t.href}}" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 4px; border-top: 1px solid #F0ECE7; text-decoration: none; color: #141414">
              <span style="font-size: 22px; font-weight: 900; min-width: 36px">{{t.n}}</span>
              <span style="flex-grow: 1; font-size: 14px; font-weight: 700">{{t.title}}</span>
              <span aria-hidden="true">→</span>
            </a>
          </sc-for>
        </section>
        <section aria-labelledby="speed-title" style="flex: 1 1 300px; background: #FFFFFF; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
          <h2 id="speed-title" style="margin: 0; font-size: 17px; font-weight: 900">等待时间 · p50 / p95</h2>
          <sc-for list="{{health}}" as="h" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #F0ECE7">
              <i style="width: 8px; height: 8px; border-radius: 50%; background: {{h.dot}}"></i>
              <span style="flex-grow: 1; font-size: 14px">{{h.name}}</span>
              <span style="font-family: 'DM Mono', monospace; font-size: 13px">{{h.v}}</span>
            </div>
          </sc-for>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: '14', view: 'line', metric: 'replies' };
  }
  renderVals() {
    var self = this;
    var COL = { g: '#E8561E', j: '#2F7BEA', m: '#7C4DEB' };
    var range = this.state.range, view = this.state.view, metric = this.state.metric;
    var users = metric === 'users';
    var labels, g, j, m;
    if (range === '24h') {
      labels = []; g = []; j = []; m = [];
      for (var h = 0; h < 24; h++) {
        labels.push((h < 10 ? '0' : '') + h + ':00');
        var wave = Math.round(6 + 10 * Math.max(0, Math.sin((h - 6) / 24 * Math.PI * 2)) + (h % 3));
        g.push(users ? Math.max(1, Math.round(wave / 4)) : wave + 3);
        j.push(users ? Math.max(1, Math.round(wave / 5)) : wave);
        m.push(users ? Math.max(0, Math.round(wave / 6)) : Math.max(1, wave - 2));
      }
    } else {
      var DAYS = ['10-10','10-11','10-12','10-13','10-14','10-15','10-16','10-17','10-18','10-19','10-20','10-21','10-22','10-23'];
      var G = users ? [5,6,6,7,8,9,10,11,11,12,13,14,14,15] : [40,52,48,61,70,88,96,110,104,121,130,138,142,150];
      var J = users ? [4,5,5,6,7,7,8,9,9,10,11,11,12,13] : [36,41,45,50,62,70,81,92,90,101,112,120,131,140];
      var M = users ? [3,3,4,4,5,6,6,7,7,8,8,9,10,10] : [30,33,35,41,48,55,64,72,76,84,95,101,113,122];
      var s = DAYS.length - Number(range);
      labels = DAYS.slice(s); g = G.slice(s); j = J.slice(s); m = M.slice(s);
    }
    var max = Math.max.apply(null, g.concat(j, m)) * 1.1;
    var pts = function (arr) { return arr.map(function (v, i) { return (i / (arr.length - 1) * 640).toFixed(1) + ',' + (220 - v / max * 210).toFixed(1); }).join(' '); };
    var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
    var sg = users ? Math.max.apply(null, g) + 6 : sum(g), sj = users ? Math.max.apply(null, j) + 5 : sum(j), sm = users ? Math.max.apply(null, m) + 4 : sum(m);
    var tot = sg + sj + sm;
    var a1 = sg / tot * 360, a2 = a1 + sj / tot * 360;
    var pct = function (v) { return Math.round(v / tot * 100) + '%'; };
    var rows = [];
    for (var i = labels.length - 1; i >= 0; i--) rows.push({ day: range === '24h' ? labels[i] : '2026-' + labels[i], g: g[i], j: j[i], m: m[i], t: users ? '—' : g[i] + j[i] + m[i] });
    var step = labels.length > 14 ? 4 : labels.length > 7 ? 2 : 1;
    return {
      lineOn: view === 'line', pieOn: view === 'pie', tableOn: view === 'table',
      metricLabel: users ? '聊天人数' : '回复', unit: users ? '人' : '条',
      timeHead: range === '24h' ? '时间 UTC' : '日期 UTC', sumHead: users ? '' : '合计',
      lines: [{ pts: pts(g), col: COL.g }, { pts: pts(j), col: COL.j }, { pts: pts(m), col: COL.m }],
      gridY: [10, 80, 150, 220].map(function (y) { return { y: y }; }),
      xlabels: labels.filter(function (_, i) { return i % step === 0; }),
      legend: [{ name: '瓜瓜', col: COL.g, v: sg, share: pct(sg) }, { name: 'JOJO', col: COL.j, v: sj, share: pct(sj) }, { name: '陈吉米', col: COL.m, v: sm, share: pct(sm) }],
      pie: 'conic-gradient(' + COL.g + ' 0 ' + a1 + 'deg, ' + COL.j + ' ' + a1 + 'deg ' + a2 + 'deg, ' + COL.m + ' ' + a2 + 'deg 360deg)',
      pieAria: '瓜瓜 ' + pct(sg) + '，JOJO ' + pct(sj) + '，陈吉米 ' + pct(sm), total: tot, rows: rows,
      metrics: [['replies', '回复'], ['users', '聊天人数']].map(function (x) { var on = metric === x[0]; return { label: x[1], on: on, bg: on ? '#141414' : 'transparent', fg: on ? '#FFFFFF' : '#141414', pick: function () { self.setState({ metric: x[0] }); } }; }),
      ranges: [['24h', '24H'], ['7', '7 天'], ['14', '14 天']].map(function (r) { var on = range === r[0]; return { label: r[1], on: on, bg: on ? '#141414' : 'transparent', fg: on ? '#FFFFFF' : '#141414', pick: function () { self.setState({ range: r[0] }); } }; }),
      views: [['line', '折线'], ['pie', '饼图'], ['table', '表格']].map(function (v) { var on = view === v[0]; return { label: v[1], on: on, isLine: v[0] === 'line', isPie: v[0] === 'pie', isTable: v[0] === 'table', bg: on ? '#FFFFFF' : 'transparent', pick: function () { self.setState({ view: v[0] }); } }; }),
      todo: [
        { n: '9', title: '共创收件箱', href: 'Inbox.dc.html' },
        { n: '1', title: '阵容草稿未发布', href: 'Cast.dc.html' },
        { n: '3', title: '测试对话', href: '#' },
        { n: '12/20', title: '朋友第一批 · 已兑换', href: 'Invites.dc.html' }
      ],
      health: [
        { name: '文字', v: '2.1s / 5.0s', dot: '#1E8E4E' },
        { name: '审核', v: '1.4s / 3.8s', dot: '#1E8E4E' },
        { name: '语音', v: '2.6s / 7.9s', dot: '#D98A00' },
        { name: '合计', v: '6.3s / 14s', dot: '#1E8E4E' }
      ]
    };
  }
}
</script>
</body>
</html>
