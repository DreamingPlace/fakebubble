<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>共创</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}
@keyframes ccIn { from { opacity: 0; transform: translateY(18px) rotate(var(--t, 0deg)) } to { opacity: 1; transform: rotate(var(--t, 0deg)) } }
@keyframes ccOpen { from { opacity: 0; max-height: 0 } to { opacity: 1; max-height: 160px } }
@keyframes ccRoll { 0% { transform: rotate(0) scale(1) } 50% { transform: rotate(200deg) scale(1.15) } 100% { transform: rotate(360deg) scale(1) } }
@keyframes ccFly { 0% { transform: none; opacity: 1 } 100% { transform: translateY(-60px) rotate(-8deg) scale(0.9); opacity: 0 } }
@keyframes ccLand { from { opacity: 0; transform: translateY(30px) rotate(-12deg) scale(0.9) } to { opacity: 1; transform: rotate(-3deg) } }
@keyframes ccSwap { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
.cc-in { animation: ccIn 420ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
.cc-open { animation: ccOpen 320ms cubic-bezier(0.2, 0.82, 0.24, 1) both; overflow: hidden }
.cc-roll { animation: ccRoll 520ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
.cc-land { animation: ccLand 520ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
.cc-swap { animation: ccSwap 260ms ease both }
@media (prefers-reduced-motion: reduce) { .cc-in, .cc-open, .cc-roll, .cc-land, .cc-swap { animation-duration: 1ms !important; animation-delay: 0ms !important } }
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: radial-gradient(70% 30% at 10% 10%, #C6E4FF 0%, transparent 70%), radial-gradient(60% 30% at 95% 45%, #D5F6EE 0%, transparent 70%), radial-gradient(80% 35% at 30% 100%, #97C8F5 0%, transparent 70%), #FAF8F6; color: #141414; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 47px; flex-shrink: 0; background: #2B2A2E; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #B5B0AA">status bar · system</div>

  <div style="flex-shrink: 0; padding: 10px 16px 6px; display: flex; align-items: center; gap: 10px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em">让JOJO更像JOJO</h1>
      <span style="font-family: 'DM Mono', monospace; font-size: 12px">{{progress}}</span>
    </div>
    <a href="Chat.dc.html" aria-label="关闭" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.8); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>

  <sc-if value="{{thanked}}" hint-placeholder-val="{{ false }}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center">
      <div class="cc-land" style="position: relative; background: #FFFFFF; border-radius: 4px; padding: 22px 22px 16px; box-shadow: 0 12px 30px rgba(40, 24, 60, 0.16); display: flex; flex-direction: column; gap: 6px">
        <i aria-hidden="true" style="position: absolute; left: 50%; top: -9px; width: 64px; height: 18px; transform: translateX(-50%) rotate(3deg); background: #97C8F5; opacity: 0.85"></i>
        <span style="font-size: 20px; font-weight: 900">JOJO收到了你的小纸条</span>
      </div>
      <a href="Chat.dc.html" class="cc-swap" style="animation-delay: 300ms; height: 46px; padding: 0 22px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">回去聊天</a>
    </div>
  </sc-if>

  <sc-if value="{{writing}}" hint-placeholder-val="{{ true }}">
    <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 6px 16px 10px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
        <div class="cc-in" style="--t: {{c.tilt}}; animation-delay: {{c.delay}}; border-radius: 22px; padding: 3px; background: rgba(255, 255, 255, 0.55); border: 1px solid #FFFFFF; transform: rotate({{c.tilt}}); opacity: {{c.op}}">
          <div style="border-radius: 19px; background: {{c.face}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">

            <sc-if value="{{c.isStory}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; line-height: 1.4">
                <span>JOJO 和</span>
                <label style="position: relative; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">选一个角色</span>
                  <select onChange="{{pickWho}}" style="height: 36px; padding: 0 30px 0 12px; border: none; border-radius: 999px; background: #141414; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 900; appearance: none; cursor: pointer">
                    <sc-for list="{{others}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}" selected="{{o.sel}}">{{o.n}}</option></sc-for>
                  </select>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true" style="position: absolute; right: 11px; top: 12px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
                </label>
                <button type="button" onClick="{{roll}}" aria-label="随机换一个" style="width: 36px; height: 36px; border: none; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(40, 24, 60, 0.12)">
                  <svg class="{{rollClass}}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><circle cx="9" cy="9" r="1.2" fill="#141414"></circle><circle cx="15" cy="15" r="1.2" fill="#141414"></circle><circle cx="15" cy="9" r="1.2" fill="#141414"></circle><circle cx="9" cy="15" r="1.2" fill="#141414"></circle></svg>
                </button>
                <span>之间的故事</span>
              </div>
            </sc-if>
            <sc-if value="{{c.isQ}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 15px; font-weight: 900; line-height: 1.4">{{c.q}}</span>
            </sc-if>

            <sc-if value="{{c.used}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(20, 20, 20, 0.08); display: flex; align-items: center; font-size: 12px">明天再来</span></sc-if>
            <sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}">
              <div class="cc-open" style="display: flex; flex-direction: column; gap: 8px">
                <sc-if value="{{c.dialogue}}" hint-placeholder-val="{{ false }}">
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700">你说<input type="text" value="我再玩十分钟" style="height: 40px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 999px; background: #141414; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 400"></label>
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700">JOJO<input type="text" style="height: 40px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 400"></label>
                </sc-if>
                <sc-if value="{{c.text}}" hint-placeholder-val="{{ true }}">
                  <label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">你的回答</span><textarea rows="3" style="flex-grow: 1; box-sizing: border-box; padding: 10px 14px; border: none; border-radius: 18px; background: #FFFFFF; font: inherit; font-size: 15px; line-height: 1.5; resize: none">{{c.draft}}</textarea></label>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{c.canOpen}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{c.toggle}}" aria-label="{{c.btnAria}}" style="align-self: flex-end; width: 40px; height: 40px; border: none; border-radius: 50%; background: {{c.btnBg}}; color: {{c.btnFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 200ms ease, transform 200ms ease; transform: {{c.btnRot}}">
                <sc-if value="{{c.showPen}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"></path></svg></sc-if>
                <sc-if value="{{c.showCheck}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
              </button>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="flex-shrink: 0; padding: 6px 16px 12px; display: flex; gap: 8px">
      <button type="button" aria-label="换一批" style="width: 48px; height: 48px; border: 1px solid #E4DED7; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
      <button type="button" onClick="{{send}}" style="flex-grow: 1; height: 48px; border: none; border-radius: 999px; background: #141414; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">交给JOJO</button>
    </div>
  </sc-if>

  <div style="height: 80px; flex-shrink: 0; background: #2B2A2E; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #B5B0AA">Safari address bar · system</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 1, written: { 0: true }, sent: false, who: 0, rolls: 0 };
  }
  renderVals() {
    var self = this;
    var NAMES = ['陈吉米', '瓜瓜', '[角色 4]', '[角色 5]', '[角色 6]'];
    var Q = [
      { q: 'JOJO 赢了一局游戏，第一句话会说什么？', face: 'linear-gradient(160deg, #C6E4FF, #FFFFFF)', tilt: '-1deg', draft: '“这把是我 carry 的，你承认吧。”' },
      { story: true, face: 'linear-gradient(160deg, #DCD2FF, #FFFFFF)', tilt: '0.6deg' },
      { q: '你说要再玩十分钟，JOJO 会怎么回你？', face: 'linear-gradient(160deg, #D5F6EE, #FFFFFF)', tilt: '1deg', dialogue: true },
      { q: '你觉得 JOJO 小时候是什么样？', face: 'linear-gradient(160deg, #FFEBC9, #FFFFFF)', tilt: '-0.6deg', used: true }
    ];
    var written = this.state.written;
    var n = Object.keys(written).filter(function (k) { return written[k]; }).length;
    var cards = Q.map(function (c, i) {
      var open = self.state.open === i && !c.used, done = !!written[i];
      return {
        q: c.q || '', isStory: !!c.story, isQ: !c.story, face: c.face, tilt: c.tilt, delay: (i * 70) + 'ms', op: c.used ? 0.6 : 1,
        draft: c.draft || '', used: !!c.used, open: open, dialogue: !!c.dialogue, text: !c.dialogue, canOpen: !c.used,
        showPen: !open, showCheck: open, btnAria: open ? '写好了' : (done ? '改一改' : '写下来'),
        btnBg: open ? '#141414' : (done ? '#1E5E36' : '#FFFFFF'), btnFg: open || done ? '#FFFFFF' : '#141414', btnRot: open ? 'rotate(0)' : 'none',
        toggle: function () { var w = Object.assign({}, self.state.written); if (open) { w[i] = true; self.setState({ open: -1, written: w }); } else self.setState({ open: i }); }
      };
    });
    var who = this.state.who;
    return {
      cards: cards, progress: n + ' / 4',
      others: NAMES.map(function (nm, i) { return { n: nm, v: String(i), sel: i === who }; }),
      pickWho: function (e) { self.setState({ who: Number(e.target.value) }); },
      roll: function () { var next = (who + 1 + Math.floor(Math.random() * (NAMES.length - 1))) % NAMES.length; self.setState({ who: next, rolls: self.state.rolls + 1 }); },
      rollClass: this.state.rolls % 2 ? 'cc-roll' : 'cc-roll cc-swap',
      thanked: this.state.sent, writing: !this.state.sent,
      send: function () { self.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
