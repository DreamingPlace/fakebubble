<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台导航</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<aside style="width: 248px; min-height: 1100px; box-sizing: border-box; padding: 24px 14px; display: flex; flex-direction: column; gap: 20px; color: #141414; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 10px">
    <dc-import name="Hand" text="burbur" size="34" color="#141414" weight="2" logo="{{ true }}" hint-size="110px,34px"></dc-import>
    <span style="margin-left: auto; height: 20px; padding: 0 8px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em">ADMIN</span>
  </div>
  <nav aria-label="后台导航" style="display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{g.hasLabel}}" hint-placeholder-val="{{ true }}">
          <span style="padding: 0 12px 4px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #5A5A5A">{{g.label}}</span>
        </sc-if>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
          <a href="{{i.href}}" aria-current="{{i.aria}}" style="height: 38px; padding: 0 12px; border-radius: 999px; background: {{i.bg}}; color: {{i.fg}}; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: {{i.weight}}; text-decoration: none">
            <span>{{i.label}}</span>
            <sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{i.badgeBg}}; color: {{i.badgeFg}}; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px">{{i.badge}}</span></sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
  <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.75)">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(140deg, #FFB295, #DCD2FF); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px">主</span>
    <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 13px; font-weight: 700">主管理员</span><span style="font-family: 'DM Mono', monospace; font-size: 11px; color: #5A5A5A">owner</span></span>
    <a href="#" style="height: 32px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; font-size: 12px; font-weight: 700; text-decoration: none">我的账号</a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["总览","角色工作台","关系与故事","共创收件箱","邀请与额度","积分发放","玩家统计","测试对话","消耗表","模型与价格","系统状态","管理员与权限"],"default":"总览"},"$preview":{"width":260,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var cur = this.props.current ?? '总览';
    var mk = function (label, href, badge) {
      var on = label === cur;
      return {
        label: label, href: href, aria: on ? 'page' : 'false',
        bg: on ? '#141414' : 'transparent', fg: on ? '#FFFFFF' : '#141414', weight: on ? 700 : 500,
        hasBadge: !!badge, badge: badge || '',
        badgeBg: on ? '#FFFFFF' : '#E8561E', badgeFg: on ? '#141414' : '#FFFFFF'
      };
    };
    return {
      groups: [
        { hasLabel: false, label: '', items: [mk('总览', 'Dashboard.dc.html')] },
        { hasLabel: true, label: '角色', items: [mk('角色工作台', 'Workbench.dc.html', '1'), mk('关系与故事', 'Cast.dc.html'), mk('共创收件箱', 'Inbox.dc.html', '9')] },
        { hasLabel: true, label: '玩家', items: [mk('邀请与额度', 'Invites.dc.html'), mk('积分发放', '#')] },
        { hasLabel: true, label: '运营', items: [mk('玩家统计', 'Stats.dc.html'), mk('消耗表', 'Usage.dc.html'), mk('测试对话', '#', '3')] },
        { hasLabel: true, label: '系统', items: [mk('模型与价格', '#'), mk('系统状态', 'System.dc.html'), mk('管理员与权限', '#')] }
      ]
    };
  }
}
</script>
</body>
</html>
