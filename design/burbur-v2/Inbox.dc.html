<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>共创收件箱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
@keyframes ibIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
.ib-in { animation: ibIn 340ms cubic-bezier(0.2, 0.82, 0.24, 1) both }
@media (prefers-reduced-motion: reduce) { .ib-in { animation-duration: 1ms !important } }
</style>
</helmet>
<div style="min-height: 1320px; background: radial-gradient(40% 22% at 25% 0%, #FFE3D3 0%, transparent 70%), radial-gradient(30% 20% at 80% 0%, #C6E4FF 0%, transparent 70%), #FAF8F6; color: #141414; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-wrap: wrap; font-variant-numeric: tabular-nums">

  <div style="flex: 1 1 248px; max-width: 260px"><dc-import name="AdminNav" current="共创收件箱" hint-size="248px,1100px"></dc-import></div>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px">
    <div style="max-width: 1160px; display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #4A4A4A">示例</span>
          <h1 style="margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.04em; line-height: 1">共创收件箱</h1>
        </div>
        <div role="group" aria-label="状态" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); border: 1px solid #FFFFFF">
          <button type="button" aria-pressed="true" style="height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: #141414; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">待处理 9</button>
          <button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; font-weight: 600">已采用 23</button>
          <button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; font-weight: 600">不用 11</button>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">

        <nav aria-label="位置" style="flex: 1 1 220px; max-width: 240px; background: rgba(255, 255, 255, 0.85); border-radius: 24px; padding: 12px 10px; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{tree}}" as="g" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: center; gap: 6px; padding: 0 10px 4px; font-size: 12px; font-weight: 900"><i style="width: 8px; height: 8px; border-radius: 50%; background: {{g.col}}"></i>{{g.label}}</span>
              <sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
                <button type="button" onClick="{{i.pick}}" aria-current="{{i.aria}}" style="height: 36px; padding: 0 10px; border: none; border-radius: 999px; background: {{i.bg}}; color: {{i.fg}}; font: inherit; font-size: 13px; font-weight: {{i.weight}}; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
                  <span>{{i.label}}</span>
                  <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{i.badgeBg}}; color: {{i.badgeFg}}; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px">{{i.n}}</span>
                </button>
              </sc-for>
            </div>
          </sc-for>
        </nav>

        <section aria-labelledby="slot-title" style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
          <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
              <h2 id="slot-title" style="margin: 0; font-size: 20px; font-weight: 900">{{slot.title}}</h2>
              <a href="{{slot.href}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4DED7; display: flex; align-items: center; font-size: 13px; font-weight: 700; text-decoration: none">{{slot.open}}</a>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 18px; background: #F7F4F0">
              <span style="font-size: 12px; font-weight: 700">现在的内容（v12 已发布）</span>
              <span style="font-size: 14px; line-height: 1.6">{{slot.current}}</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
              <span style="font-size: 12px; color: #3F3F3F">最近给玩家的问法：</span>
              <sc-for list="{{slot.asked}}" as="q" hint-placeholder-count="3"><span style="min-height: 26px; padding: 4px 10px; box-sizing: border-box; border-radius: 999px; background: #F3F0EC; font-size: 12px; display: flex; align-items: center">{{q}}</span></sc-for>
            </div>
          </div>

          <sc-for list="{{items}}" as="x" hint-placeholder-count="3">
            <article class="ib-in" style="background: {{x.bg}}; transition: background 260ms ease; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 12px; color: #3F3F3F">玩家看到的问题：<b style="color: #141414">{{x.q}}</b></span>
              <sc-if value="{{x.isDialogue}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <span style="align-self: flex-end; max-width: 80%; background: #141414; color: #FFFFFF; border-radius: 18px 6px 18px 18px; padding: 8px 12px; font-size: 14px">{{x.you}}</span>
                  <span style="align-self: flex-start; max-width: 80%; background: #F3F0EC; border-radius: 6px 18px 18px 18px; padding: 8px 12px; font-size: 14px">{{x.a}}</span>
                </div>
              </sc-if>
              <sc-if value="{{x.isText}}" hint-placeholder-val="{{ true }}"><span style="font-size: 15px; line-height: 1.6">{{x.a}}</span></sc-if>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                <span style="flex-grow: 1; font-family: 'DM Mono', monospace; font-size: 11px; color: #4A4A4A">{{x.meta}}</span>
                <button type="button" onClick="{{x.star}}" aria-pressed="{{x.starred}}" aria-label="标星" style="width: 32px; height: 32px; border: 1px solid #E4DED7; border-radius: 50%; background: #FFFFFF; color: {{x.starCol}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="{{x.starFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path></svg></button>
                <button type="button" onClick="{{x.skip}}" style="width: 72px; height: 32px; border: 1px solid #E4DED7; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">不用</button>
                <button type="button" onClick="{{x.adopt}}" aria-pressed="{{x.adopted}}" style="width: 96px; height: 32px; border: none; border-radius: 999px; background: {{x.adBg}}; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{x.adLabel}}</button>
              </div>
            </article>
          </sc-for>
          <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="background: #FFFFFF; border-radius: 24px; padding: 28px; text-align: center; font-size: 14px">这个位置的投稿都处理完了</div></sc-if>
        </section>

        <aside aria-labelledby="today-title" style="flex: 1 1 260px; max-width: 300px; background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <h2 id="today-title" style="margin: 0; font-size: 15px; font-weight: 900">今天出题的位置</h2>
          <sc-for list="{{today}}" as="t" hint-placeholder-count="6">
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-top: 1px solid #F0ECE7">
              <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700"><span>{{t.slot}}</span><span style="font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 400">{{t.why}}</span></span>
              <span style="font-size: 12px; color: #3F3F3F">“{{t.q}}”</span>
              <span style="height: 5px; border-radius: 999px; background: #EFEBE6; overflow: hidden"><span style="display: block; width: {{t.fill}}; height: 100%; background: #141414"></span></span>
            </div>
          </sc-for>
          <button type="button" style="height: 36px; border: 1px solid #E4DED7; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">换一批今天的问法</button>
        </aside>
      </div>
    </div>
  </main>
</div>
</x-dc>

  }
}
</script>
