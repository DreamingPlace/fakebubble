<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Calmer colour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2833}a:hover{color:#5B4FC4}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; background: #F6F4F1; color: #2B2833; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; gap: 32px">

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px">

    <section style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #6E6875">现在</span>
      <div style="height: 420px; border-radius: 24px; background: #F8F7F5; display: grid; grid-template-columns: 200px 1fr; overflow: hidden; border: 1px solid #ECE8E3">
        <div style="padding: 20px 14px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; color: #6E6875; padding: 6px 12px">运营</span>
          <span style="height: 38px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; padding: 0 14px; font-size: 14px">玩家统计</span>
          <span style="height: 38px; display: flex; align-items: center; padding: 0 14px; font-size: 14px">消耗表</span>
          <span style="height: 38px; display: flex; align-items: center; padding: 0 14px; font-size: 14px">测试对话</span>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; gap: 8px">
            <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; font-size: 13px">全部角色</span>
            <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #EFEDEA; display: flex; align-items: center; font-size: 13px">瓜瓜</span>
            <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #EFEDEA; display: flex; align-items: center; font-size: 13px">JOJO</span>
          </div>
          <div style="border-radius: 18px; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px">
            <span style="font-size: 15px; font-weight: 700">JOJO · 玩家#1060</span>
            <div style="display: flex; gap: 8px">
              <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; font-size: 13px">星标</span>
              <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; font-size: 13px">标为已处理</span>
              <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; font-size: 13px">归档</span>
            </div>
            <span style="height: 40px; border-radius: 999px; background: #141414; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px">保存备注</span>
          </div>
        </div>
      </div>
      <span style="font-size: 14px; color: #6E6875">黑底白字到处都是：选中、筛选、普通按钮、主按钮都一样重，眼睛找不到重点。</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #5B4FC4">建议</span>
      <div style="height: 420px; border-radius: 24px; background: #F6F4F1; display: grid; grid-template-columns: 200px 1fr; overflow: hidden; border: 1px solid #ECE8E3">
        <div style="padding: 20px 14px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; color: #6E6875; padding: 6px 12px">运营</span>
          <span style="height: 38px; border-radius: 12px; background: #EEEBFA; color: #3F3596; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; font-weight: 700"><i style="width: 6px; height: 6px; border-radius: 50%; background: #5B4FC4"></i>玩家统计</span>
          <span style="height: 38px; display: flex; align-items: center; padding: 0 28px; font-size: 14px">消耗表</span>
          <span style="height: 38px; display: flex; align-items: center; padding: 0 28px; font-size: 14px">测试对话</span>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; gap: 8px">
            <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #EEEBFA; color: #3F3596; display: flex; align-items: center; font-size: 13px; font-weight: 700">全部角色</span>
            <span style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DDD6; box-sizing: border-box; display: flex; align-items: center; font-size: 13px">瓜瓜</span>
            <span style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DDD6; box-sizing: border-box; display: flex; align-items: center; font-size: 13px">JOJO</span>
          </div>
          <div style="border-radius: 18px; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #ECE8E3">
            <span style="font-size: 15px; font-weight: 700">JOJO · 玩家#1060</span>
            <div style="display: flex; gap: 8px">
              <span style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DDD6; box-sizing: border-box; display: flex; align-items: center; font-size: 13px">星标</span>
              <span style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DDD6; box-sizing: border-box; display: flex; align-items: center; font-size: 13px">标为已处理</span>
              <span style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DDD6; box-sizing: border-box; display: flex; align-items: center; font-size: 13px">归档</span>
            </div>
            <span style="height: 40px; border-radius: 999px; background: #5B4FC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">保存备注</span>
          </div>
        </div>
      </div>
      <span style="font-size: 14px; color: #6E6875">每屏只有一个实心主按钮；选中用浅紫底；其它都是白底细边。</span>
    </section>
  </div>

  <section style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #F6F4F1; border: 1px solid #ECE8E3"></i><b style="font-size: 13px">底色</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#F6F4F1</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE8E3"></i><b style="font-size: 13px">卡片</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#FFFFFF</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #2B2833"></i><b style="font-size: 13px">文字</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#2B2833</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #6E6875"></i><b style="font-size: 13px">次要文字</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#6E6875</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #5B4FC4"></i><b style="font-size: 13px">主按钮</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#5B4FC4</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #EEEBFA"></i><b style="font-size: 13px">选中</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#EEEBFA</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #E7F3EC; border: 2px solid #2F7A4F; box-sizing: border-box"></i><b style="font-size: 13px">成功</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#2F7A4F</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><i style="height: 64px; border-radius: 16px; background: #FBEDEA; border: 2px solid #B23A26; box-sizing: border-box"></i><b style="font-size: 13px">危险</b><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #6E6875">#B23A26</span></div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
