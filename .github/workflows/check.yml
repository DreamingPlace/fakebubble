name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # corepack must run before setup-node so `cache: pnpm` can find the pnpm binary.
      - name: Enable corepack (pnpm 11.19.0 from package.json)
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.x
          cache: pnpm

      - name: Ensure openssl is available
        run: command -v openssl >/dev/null || (sudo apt-get update && sudo apt-get install -y openssl)

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm web:player:build
